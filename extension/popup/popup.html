<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>Block4Me</title></head>
<body>
  <h1>Block4Me</h1>
  <p id="host" class="host"></p>
  <label class="row"><span>Bloquer les pubs sur ce site</span>
    <input type="checkbox" id="toggle"><span class="switch"></span></label>
  <div class="stats">
    <div><strong id="tab">0</strong><small>masquées sur cette page</small></div>
    <div><strong id="total">0</strong><small>au total</small></div>
  </div>
  <button id="reload">Recharger la page</button>
  <script src="popup.js"></script>
</body></html>
